name: Compilar Mod Minecraft

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Codigo
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle Automático
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    - name: Executar Compilacao Gradle
      run: gradle build --no-daemon

    - name: Disponibilizar arquivo JAR
      uses: actions/upload-artifact@v4
      with:
        name: NanoHorrorMod-1.20.1
        path: build/libs/*.jar
